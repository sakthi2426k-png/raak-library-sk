<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</head>
<body>
    <h2>Borrowing History</h2>
    <div id="history"></div>

    <script>
        async function loadHistory() {
            const { data } = await window.supabase.from('transactions').select('*');
            const div = document.getElementById('history');
            (data || []).forEach(t => {
                div.innerHTML += `<p>${t.student_name} borrowed ${t.book_name}</p>`;
            });
        }
        loadHistory();
    </script>
</body>
</html>
